<!doctype html>
<html lang="pt-BR">

    <title>flowly — sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;

    <div>
      <strong>Sem conexão</strong>
