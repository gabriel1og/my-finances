name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A versão vem do .nvmrc: jsdom 30 (e o undici 8 que ele carrega) exige
      # Node >= 22.22.2. Em Node 20 a suíte passa mas o processo derruba
      # "webidl.util.markAsUncloneable is not a function" e o job falha.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci respeita o package-lock.json e falha se ele estiver dessincronizado.
      - run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # O build não fala com o Supabase, mas o client é construído no
          # módulo e quebra se as variáveis não existirem. Valores de fachada
          # bastam; nada aqui é segredo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
